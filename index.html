<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1210" />
    <meta name="description" content="Itqan — daily tasks, habits and long-term goals." />
    <title>Itqan</title>
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      try {
        var s = JSON.parse(localStorage.getItem('itqan-store') || '{}');
        var t = (s.state && s.state.settings && s.state.settings.theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
