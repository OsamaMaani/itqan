<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1210" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Itqan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Itqan — daily tasks, habits and long-term goals." />
    <title>Itqan</title>
    <script>
      // Apply the saved theme and language direction before first paint, so there is no
      // light/dark flash and Arabic never flashes left-to-right.
      try {
        var s = JSON.parse(localStorage.getItem('itqan-store') || '{}');
        var set = (s.state && s.state.settings) || {};
        var t = set.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        var lang = { ar: 'ar', fr: 'fr-FR', zh: 'zh-CN', es: 'es-ES' }[set.language];
        if (lang) { document.documentElement.lang = lang; if (lang === 'ar') document.documentElement.dir = 'rtl'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
